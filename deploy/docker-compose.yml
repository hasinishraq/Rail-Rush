# Local stand-in for the production platform (§25). From the repo root:
#   cp deploy/.env.example deploy/.env    # then fill in the secrets
#   docker compose -f deploy/docker-compose.yml up --build
# Public API on http://localhost:8000 (Traefik), internal endpoints of the auth pod
# on http://localhost:9091, Redpanda Console on http://localhost:8081, fake SMS
# gateway (prints OTPs, GET /last?phone=) on http://localhost:8091.
# Logs of every container: Grafana → Railway Logs (Loki, collected by Alloy).

name: railway-application   # fixed project name: Alloy collects logs of this project only

x-app: &app
  image: railway-app:dev
  build: { context: .., dockerfile: deploy/app.Dockerfile }
  environment: &env
    KAFKA_BROKERS: redpanda:9092
    PG_URL: postgres://${POSTGRES_USER:?set in deploy/.env}:${POSTGRES_PASSWORD:?set in deploy/.env}@postgres:5432/${POSTGRES_DB:?set in deploy/.env}?sslmode=disable
    PG_READ_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    REDIS_ADDR: redis:6379
    ADMISSION_MODE: local
    ADMISSION_RATE: "50"
    ADMISSION_KEY_FILE: /keys/admission-es256.pem
    JWT_SIGNING_KEY_FILE: /keys/dev-es256.pem
    JWT_KID: dev1
    TICKET_SIGNING_KEY_FILE: /keys/ticket-es256.pem
    GATEWAYS: fake
    GATEWAY_BASE_URL: http://fakegateway:8090
    GATEWAY_SECRET: ${GATEWAY_SECRET:?set in deploy/.env}
    SMS_PROVIDERS: http://fakesms:8091
    OTP_KEY: ${OTP_KEY:?set in deploy/.env}
    OTP_DEV_CODE: ${OTP_DEV_CODE:-}            # no real SMS locally: this code verifies any booking
    NID_KEY: ${NID_KEY:?set in deploy/.env}
    INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set in deploy/.env}
    TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}     # empty secret: no CAPTCHA on register/login
    TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    RETURN_URL_ALLOWLIST: http://localhost,https://localhost
    HOLD_TTL: ${HOLD_TTL:-10m}                 # HOLD_TTL=30s for saga tests
    SELECT_IDLE_TTL: ${SELECT_IDLE_TTL:-2m}    # SELECT_IDLE_TTL=10s for lock-expiry tests
    SELECT_MAX_TTL: 5m
    LOG_LEVEL: info
  volumes: ["keys:/keys:ro"]
  depends_on: &deps
    redpanda-init: { condition: service_completed_successfully }
    migrate: { condition: service_completed_successfully }
    keygen: { condition: service_completed_successfully }
    redis: { condition: service_started }
  restart: unless-stopped

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command: >
      redpanda start --mode dev-container --smp 1
      --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092"]

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    depends_on: [redpanda]
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "until rpk -X brokers=redpanda:9092 -X admin.hosts=redpanda:9644 cluster health --exit-when-healthy; do sleep 1; done &&
       (rpk -X brokers=redpanda:9092 topic create booking-requests inventory-events -p 256 -r 1 || true) &&
       (rpk -X brokers=redpanda:9092 topic create payment-events notifications -p 32 -r 1 || true)"

  console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    environment: { KAFKA_BROKERS: redpanda:9092 }
    ports: ["8081:8080"]
    depends_on: { redpanda-init: { condition: service_completed_successfully } }
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: "${POSTGRES_USER}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: "${POSTGRES_DB}" }
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      retries: 30

  redis:
    image: redis:7
    ports: ["6379:6379"]

  keygen:
    <<: *app
    user: "0"
    entrypoint: ["/bin/sh", "-c", "/app keygen --dir /keys && chown -R 10001 /keys"]
    volumes: ["keys:/keys"]
    depends_on: {}
    restart: "no"

  migrate:
    <<: *app
    # schema_v4 + Bangladesh seed (trains, layouts, fare chart); DEV_OPEN_IN=2m opens the sales windows 2 minutes after start
    command: ["migrate", "up", "--seed=dev", "--open-in=${DEV_OPEN_IN:-0s}"]
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  api:
    <<: *app
    environment: { <<: *env, ROLE: api }
    deploy: { replicas: 3 }
    labels:
      - traefik.http.routers.api.rule=PathRegexp(`^/v1/journeys/[0-9]+/selection`) || PathPrefix(`/v1/holds`) || PathPrefix(`/v1/requests`) || PathPrefix(`/v1/payments`) || PathPrefix(`/v1/webhooks`) || PathPrefix(`/v1/bookings`) || PathPrefix(`/v1/tickets`) || PathPrefix(`/v1/me`) || PathPrefix(`/v1/admission`)
      - traefik.http.routers.api.priority=900          # above the search role's /v1/journeys prefix
      - traefik.http.services.api.loadbalancer.server.port=8080

  live:
    <<: *app
    environment: { <<: *env, ROLE: live }
    deploy: { replicas: 3 }
    labels:
      - traefik.http.routers.live.rule=PathRegexp(`^/v1/journeys/[0-9]+/seatmap/live$`)
      - traefik.http.routers.live.priority=1000
      - traefik.http.services.live.loadbalancer.server.port=8080
      - traefik.http.services.live.loadbalancer.responseforwarding.flushinterval=-1   # stream SSE unbuffered

  auth:
    <<: *app
    environment: { <<: *env, ROLE: auth }
    ports: ["9091:9091"]                       # internal endpoints, local only
    labels:
      - traefik.http.routers.auth.rule=PathPrefix(`/v1/auth`) || PathPrefix(`/.well-known`)
      - traefik.http.services.auth.loadbalancer.server.port=8080

  search:
    <<: *app
    environment: { <<: *env, ROLE: search }
    labels:
      - traefik.http.routers.search.rule=PathPrefix(`/v1/search`) || PathPrefix(`/v1/stations`) || PathPrefix(`/v1/journeys`) || PathPrefix(`/v1/layouts`)
      - traefik.http.services.search.loadbalancer.server.port=8080

  projector:  { <<: *app, environment: { <<: *env, ROLE: projector } }
  relay:      { <<: *app, environment: { <<: *env, ROLE: relay } }       # outbox relay + SMS notifier
  reconciler: { <<: *app, environment: { <<: *env, ROLE: reconciler } }  # + refunder
  scheduler:  { <<: *app, environment: { <<: *env, ROLE: scheduler } }

  allocator:
    image: railway-allocator:dev
    build: { context: .., dockerfile: deploy/allocator.Dockerfile }
    environment: { <<: *env }
    deploy: { replicas: 3 }
    depends_on: *deps
    restart: unless-stopped

  fakegateway:
    image: railway-fakegateway:dev
    build: { context: .., dockerfile: deploy/fakegateway.Dockerfile }
    environment: { DELAY: 500ms, FAIL_RATE: "0.05", UNKNOWN_RATE: "0.05", PUBLIC_URL: "http://localhost:8090",
                   WEBHOOK_URL: "http://traefik/v1/webhooks/payment/fake", SECRET: "${GATEWAY_SECRET}" }
    ports: ["8090:8090"]

  fakesms:
    image: railway-fakesms:dev
    build: { context: .., dockerfile: deploy/fakesms.Dockerfile }
    ports: ["8091:8091"]

  web:
    image: railway-web:dev
    build: { context: .., dockerfile: deploy/web.Dockerfile }
    ports: ["8088:80"]                         # the frontend: http://localhost:8088
    depends_on: [traefik]
    restart: unless-stopped

  traefik:
    image: traefik:v3.6   # v3.1's Docker client is too old for Docker Engine 29
    # :80 is public (port 8000) and ignores client-sent X-Forwarded-For. :81 is reachable only inside
    # the network; nginx uses it, so its X-Forwarded-For (the user's IP) is kept for per-IP limits.
    command: ["--providers.docker=true", "--entrypoints.web.address=:80",
              "--entrypoints.webapp.address=:81", "--entrypoints.webapp.forwardedheaders.insecure=true"]
    ports: ["8000:80"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"          # local only: open without a login
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/railway.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.0
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports: ["3100:3100"]
    restart: unless-stopped

  alloy:   # tails stdout/stderr of every container in this project and ships it to Loki
    image: grafana/alloy:v1.4.2
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "--disable-reporting", "/etc/alloy/config.alloy"]
    volumes:
      - ./alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports: ["12345:12345"]                     # Alloy UI: pipeline status
    depends_on: [loki]
    restart: unless-stopped

volumes:
  keys:
  loki-data:
