server {
  listen 80;
  root /usr/share/nginx/html;

  # Docker's DNS. Resolving traefik per request (via the variable) lets nginx
  # start before the edge router is up instead of exiting on "host not found".
  resolver 127.0.0.11 valid=10s ipv6=off;
  # :81 is Traefik's internal entrypoint that trusts our X-Forwarded-For (deploy/docker-compose.yml).
  set $edge http://traefik:81;

  # API and JWKS go to the edge router; the app stays same-origin.
  location /v1/ {
    proxy_pass $edge;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;      # SSE: /v1/journeys/{id}/seatmap/live, /v1/requests/{id}/stream
    proxy_read_timeout 120s;  # longer than the 15 s SSE ping
  }
  location /.well-known/ { proxy_pass $edge; }

  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
